name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan even without pushes, catches newly-disclosed vulnerability patterns.
    - cron: "0 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      # Manual build (not CodeQL's autobuilder): Kiwbi.slnx is the newer slnx solution format, safer to
      # build it explicitly than rely on autodetection.
      - name: Build solution
        run: dotnet build Kiwbi.slnx /consoleloggerparameters:NoSummary

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
